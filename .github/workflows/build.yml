name: Zbuduj APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Budowanie
        run: gradle assembleRelease --no-daemon
      - run: cp app/build/outputs/apk/release/app-release.apk KarmienieWezy.apk
      - uses: actions/upload-artifact@v4
        with:
          name: KarmienieWezy
          path: KarmienieWezy.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: Karmienie węży 2.0.${{ github.run_number }}
          make_latest: true
          files: KarmienieWezy.apk
